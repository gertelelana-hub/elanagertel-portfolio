<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Memory Lab — Elana Gertel</title>
  <!-- Fonts from Google Fonts: Comme (the texts at the bottom of the page) and Crimson Text (the small texts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comme:wght@400&family=Crimson+Text:ital,wght@0,400;1,400&display=swap">
  <link rel="stylesheet" href="styles.css?v=20261108s">
  <!-- Show the page only once the title is drawn (the marker "page-ready" comes after the scripts),
       so coming from the home page the title is simply there, without blinking -->
  <link rel="expect" href="#page-ready" blocking="render">
</head>
<body class="lab-page">
  <!-- Project page "The Memory Lab", built from Figma frame "MacBook Pro 16' - 65" and its Frame 93.
       lab.js adds the black shapes that spell "THE MEMORY LAB" (top, and white at the bottom). -->
  <main class="lab lab-invert memory" id="lab">
    <h1 class="visually-hidden">The Memory Lab</h1>

    <!-- The first screen (the title) stays in place until the end of the page: the pictures slide up
         over it, and the black end slides up behind it. lab.js puts the title shapes in it. -->
    <div class="lab-first-track">
      <div class="lab-first" id="lab-first">
        <!-- Clicking the first screen scrolls down to the first picture (Figma: "scroll to" on click) -->
        <button class="lab-first-screen" id="lab-first-screen" type="button" aria-label="Scroll down to the project"></button>

        <!-- The white title: lies exactly on the black one, but only shows over the black end,
             so the title turns white where the black end passes (lab.js puts the shapes in it) -->
        <div class="lab-white" id="lab-white">
          <div class="lab-footer-title" id="lab-footer-title"></div>
        </div>
      </div>
    </div>

    <!-- Fixed on the screen, like on the home page: languages at the top right (switching is not built
         yet), Contact Me at the bottom right (no link yet), and the small name on the left and right edges -->
    <p class="flow-small-text flow-lang">HEB, <span class="flow-lang-current">EN</span></p>
    <p class="flow-small-text flow-contact">Contact Me</p>
    <img class="flow-logo flow-logo-left" src="images/logo-elana-small.svg" alt="">
    <img class="flow-logo flow-logo-right" src="images/logo-gertel-small.svg" alt="">

    <!-- The pictures and videos: each one slides up from the bottom of the screen, stops in the
         middle of the screen, and the next one slides up over it (Figma: sticky layers) -->
    <div class="lab-track lab-track-1">
      <img class="lab-media lab-media-brain" src="images/lab-brain.jpg" alt="Painting of a man's head in profile, the brain shown open">
    </div>
    <div class="lab-track lab-track-2">
      <img class="lab-media lab-media-cover" src="images/lab-elsc-cover.jpg" alt="ELSC cover with the same painting">
    </div>
    <!-- Videos in Figma. For now their first frame is shown as a picture. -->
    <div class="lab-track lab-track-3">
      <img class="lab-media lab-media-video-1" src="images/lab-video-1.jpg" alt="Watercolor background (video)">
    </div>
    <div class="lab-track lab-track-4">
      <img class="lab-media lab-media-video-2" src="images/lab-video-2.jpg" alt="Scientific Illustration for The Human Memory Lab, illustrated by Elana Gertel (video)">
    </div>

    <!-- The black end of the page: the project details -->
    <footer class="lab-footer">
      <p class="lab-footer-text lab-year">2023</p>
      <p class="lab-footer-text lab-kind">Digital Art</p>
      <p class="lab-footer-text lab-about">An illustrated book centered on cactus forms and symbols in Israel, combining botanical artwork with Hebrew text.</p>
    </footer>
  </main>

  <script src="pieces.js?v=20261108h"></script>
  <script src="lab-organic.js?v=20261108h"></script>
  <script src="lab.js?v=20261108m"></script>
  <div id="page-ready"></div>
</body>
</html>

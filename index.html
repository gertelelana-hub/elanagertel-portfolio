<body class="home-page">
  <!-- Home page, built from the Figma flow that starts at frame "MacBook Pro 16' - 74":
       black shapes puzzle their way into "ELANA GERTEL" (frames 74 → 72 → 71),
       then break apart into the project gallery (frame 70).
       home.js adds the shapes, the project pictures and their names. -->
  <main class="flow" id="flow">
    <h1 class="visually-hidden">Elana Gertel — Portfolio</h1>
  </main>

  <!-- Fixed on the screen: languages at the top right (switching is not built yet; the line marks
       the current one, EN), Contact Me at the bottom right (no link yet), and the small name on the
       left and right edges, in the middle of the screen -->

  <p class="flow-small-text flow-contact">Contact Me</p>
  <img class="flow-logo flow-logo-left" src="images/logo-elana-small.svg" alt="">
  <img class="flow-logo flow-logo-right" src="images/logo-gertel-small.svg" alt="">

  <!-- The planned puzzle moves first, then the code that plays them -->

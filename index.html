<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elana Gertel — Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- One-screen "coming soon" page, built from Figma frame "MacBook Pro 16' - 27" (node 28:1055) -->
  <main class="shapes-page">
    <div class="shapes-stage">
      <!-- Top row: name • Portfolio • Process (link to the process page) -->
      <header class="site-header">
        <h1 class="site-name">Elana Gertel</h1>
        <img class="site-dot" src="images/dot.svg" alt="">
        <p class="site-label">Portfolio</p>
        <img class="site-dot" src="images/dot.svg" alt="">
        <a class="site-label site-link" href="process.html">Process</a>
      </header>

      <!-- "Coming soon" made of 27 black shapes, joined into one picture that covers the whole frame -->
      <img class="coming-soon-word" src="images/coming-soon-27.svg" alt="coming soon">

      <!-- Introduction at the bottom left (the line breaks are part of the design) -->
      <p class="site-intro">Visual designer.<br>Macro focused problem solver,<br>turning complex challenges into high impact solutions.</p>
    </div>
  </main>
</body>
</html>

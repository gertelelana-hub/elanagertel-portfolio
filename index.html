<body class="home-page">

       then break apart into the project gallery (frame 70).
       home.js adds the shapes, the project pictures and their names. -->

    <!-- Top left: Contact Me (no link yet) and the link to the process page -->

      <p class="flow-small-text">Contact Me</p>

    <!-- The small name on the left and right edges, at mid-height of the first screen -->

    <img class="flow-logo flow-logo-right" src="images/logo-gertel-small.svg" alt="">
  </main>

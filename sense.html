<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sense — Elana Gertel</title>
  <!-- Fonts from Google Fonts: Averia Serif Libre (the names' hover texts and contact Me), Crimson Text (the small texts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,700;1,700&family=Crimson+Text:ital,wght@0,400;1,400&display=swap">
  <link rel="stylesheet" href="styles.css?v=20261113b">
  <!-- Show the page only once the title is drawn (the marker "page-ready" comes after the scripts),
       so coming from the home page the title is simply there, without blinking -->
  <link rel="expect" href="#page-ready" blocking="render">
</head>
<body class="lab-page">
  <!-- Project page "Sense", built from Figma frame "'Sense'". For now only the title and the black end
       (the pictures and texts come later). It works like The Israeli Cactus page: lab.js adds the black
       shapes that spell "SENSE"; sense-title.js says where they go. Scrolling brings the black end up
       from below, and the title turns white where it passes. -->
  <main class="lab lab-invert sense" id="lab">
    <h1 class="visually-hidden">Sense</h1>

    <!-- The first screen (the title) stays in place until the end of the page. lab.js puts the title shapes in it. -->
    <div class="lab-first-track">
      <div class="lab-first" id="lab-first">
        <!-- Clicking the first screen scrolls down to the black end -->
        <button class="lab-first-screen" id="lab-first-screen" type="button" aria-label="Scroll down"></button>

        <!-- The white title: lies exactly on the black one, but only shows over the black end,
             so the title turns white where the black end passes (lab.js puts the shapes in it) -->
        <div class="lab-white" id="lab-white">
          <div class="lab-footer-title" id="lab-footer-title"></div>
        </div>
      </div>
    </div>

    <!-- Fixed on the screen on every page, also while scrolling (Figma: Frame 193, Frame 188 and "contact Me"):
         the small name on the left and right edges, in the middle of the screen. Hovering a half
         types its link under it: "home" under ELANA (back to the home page gallery, no intro)
         and "about me" under GERTEL. "contact Me" sits at the bottom in the middle (no link yet). -->
    <a class="flow-edge flow-edge-left" href="index.html?gallery">
      <img class="flow-logo" src="images/logo-elana-small.svg" alt="Elana">
      <span class="flow-edge-text">home<span class="flow-edge-cursor">|</span></span>
    </a>
    <a class="flow-edge flow-edge-right" href="about.html">
      <img class="flow-logo" src="images/logo-gertel-small.svg" alt="Gertel">
      <span class="flow-edge-text">about me<span class="flow-edge-cursor">|</span></span>
    </a>
    <p class="flow-small-text flow-contact">contact Me</p>

    <!-- The black end of the page -->
    <footer class="lab-footer"></footer>
  </main>

  <!-- The title (its shapes and organic letters) first, then the code that draws it -->
  <script src="pieces.js?v=20261108h"></script>
  <script src="sense-title.js?v=20261111b"></script>
  <script src="lab.js?v=20261108m"></script>
  <div id="page-ready"></div>
</body>
</html>

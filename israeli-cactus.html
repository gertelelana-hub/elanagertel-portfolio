<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Israeli Cactus — Elana Gertel</title>
  <!-- Fonts from Google Fonts: Comme (the texts at the bottom of the page) and Crimson Text (the small texts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comme:wght@400&family=Crimson+Text:ital,wght@0,400;1,400&display=swap">
  <link rel="stylesheet" href="styles.css?v=20261109g">
  <!-- Show the page only once the title is drawn (the marker "page-ready" comes after the scripts),
       so coming from the home page the title is simply there, without blinking -->
  <link rel="expect" href="#page-ready" blocking="render">
</head>
<body class="lab-page">
  <!-- Project page "The Israeli Cactus", built from Figma frame "'Israeli' Cactus".
       It works like The Memory Lab page: lab.js adds the black shapes that spell
       "THE ISRAELI CACTUS" (top, and white at the bottom); cactus-title.js says where they go. -->
  <main class="lab lab-invert cactus" id="lab">
    <h1 class="visually-hidden">The Israeli Cactus</h1>

    <!-- The first screen (title and small texts) stays in place until the end of the page:
         the spreads slide up over it, and the black end slides up behind it. lab.js puts the title shapes in it. -->
    <div class="lab-first-track">
      <div class="lab-first" id="lab-first">

        <!-- Clicking the first screen scrolls down to the first spread -->
        <button class="lab-first-screen" id="lab-first-screen" type="button" aria-label="Scroll down to the project"></button>

        <!-- The white title: lies exactly on the black one, but only shows over the black end,
             so the title turns white where the black end passes (lab.js puts the shapes in it) -->
        <div class="lab-white" id="lab-white">
          <div class="lab-footer-title" id="lab-footer-title"></div>
        </div>
      </div>
    </div>

    <!-- Fixed on the screen, like on the home page: languages at the top right (switching is not built
         yet), Contact Me at the bottom right (no link yet), and the small name on the left and right edges -->
    <p class="flow-small-text flow-lang">HEB, <span class="flow-lang-current">EN</span></p>
    <p class="flow-small-text flow-contact">Contact Me</p>
    <!-- The small name: clicking it goes back to the home page, straight to the gallery (no intro) -->
    <a href="index.html?gallery" aria-label="Elana Gertel — home page">
      <img class="flow-logo flow-logo-left" src="images/logo-elana-small.svg" alt="">
      <img class="flow-logo flow-logo-right" src="images/logo-gertel-small.svg" alt="">
    </a>

    <!-- The book, spread by spread, in the order of Figma's Frame 131: each one slides up from the
         bottom of the screen, stops in the middle of the screen, and the next one slides up over it.
         --x, --y, --w, --h: where the spread is and how big (Figma pixels, see .cactus-track). -->
    <div class="lab-track cactus-track" style="--x: 22; --y: 173; --w: 1395; --h: 1059">
      <img class="lab-media" src="images/cactus-spread-01.webp" alt="The Israeli Cactus: front cover">
    </div>
    <div class="lab-track cactus-track cactus-fold" style="--x: -4; --y: 1077.59; --w: 1458; --h: 1057">
      <img class="lab-media" src="images/cactus-spread-02.webp" alt="The Israeli Cactus: spread 1" loading="lazy">
    </div>
    <div class="lab-track cactus-track cactus-fold" style="--x: -4; --y: 1999.59; --w: 1458; --h: 1057">
      <img class="lab-media" src="images/cactus-spread-03.webp" alt="The Israeli Cactus: spread 2" loading="lazy">
    </div>
    <div class="lab-track cactus-track cactus-fold" style="--x: -8; --y: 2911; --w: 1462; --h: 1066">
      <img class="lab-media" src="images/cactus-spread-04.webp" alt="The Israeli Cactus: spread" loading="lazy">
    </div>
    <div class="lab-track cactus-track cactus-fold" style="--x: -8; --y: 3844; --w: 1462; --h: 1054">
      <img class="lab-media" src="images/cactus-spread-05.webp" alt="The Israeli Cactus: spread 4" loading="lazy">
    </div>
    <div class="lab-track cactus-track cactus-fold" style="--x: -8; --y: 4755; --w: 1462; --h: 1064">
      <img class="lab-media" src="images/cactus-spread-06.webp" alt="The Israeli Cactus: spread 5" loading="lazy">
    </div>
    <div class="lab-track cactus-track cactus-fold" style="--x: -8; --y: 5685; --w: 1462; --h: 1056">
      <img class="lab-media" src="images/cactus-spread-07.webp" alt="The Israeli Cactus: spread 6" loading="lazy">
    </div>
    <div class="lab-track cactus-track cactus-fold" style="--x: -4; --y: 6605.59; --w: 1458; --h: 1057">
      <img class="lab-media" src="images/cactus-spread-08.webp" alt="The Israeli Cactus: spread 7" loading="lazy">
    </div>
    <div class="lab-track cactus-track cactus-fold" style="--x: -8; --y: 7504; --w: 1463; --h: 1080">
      <img class="lab-media" src="images/cactus-spread-09.webp" alt="The Israeli Cactus: spread 8" loading="lazy">
    </div>
    <div class="lab-track cactus-track cactus-fold" style="--x: -4; --y: 8447.59; --w: 1458; --h: 1060">
      <img class="lab-media" src="images/cactus-spread-10.webp" alt="The Israeli Cactus: spread 3" loading="lazy">
    </div>
    <div class="lab-track cactus-track" style="--x: 16; --y: 9368; --w: 1407; --h: 1059">
      <img class="lab-media" src="images/cactus-spread-11.webp" alt="The Israeli Cactus: back cover" loading="lazy">
    </div>

    <!-- The black end of the page: the project details -->
    <footer class="lab-footer">
      <p class="lab-footer-text lab-year">2023</p>
      <p class="lab-footer-text lab-kind">Digital Art</p>
      <p class="lab-footer-text lab-about">An illustrated book centered on cactus forms and symbols in Israel, combining botanical artwork with Hebrew text.</p>
    </footer>
  </main>

  <!-- The title (its shapes and organic letters) first, then the code that draws it -->
  <script src="pieces.js?v=20261108h"></script>
  <script src="cactus-title.js?v=20261108h"></script>
  <script src="lab.js?v=20261108m"></script>
  <div id="page-ready"></div>
</body>
</html>

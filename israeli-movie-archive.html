<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Israeli Movie Archive — Elana Gertel</title>
  <!-- Fonts from Google Fonts: Averia Serif Libre (the names' hover texts and contact Me), Comme (the texts at the bottom of the page) and Crimson Text (the small texts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,700;1,700&family=Comme:wght@400&family=Crimson+Text:ital,wght@0,400;1,400&display=swap">
  <link rel="stylesheet" href="styles.css?v=20261113a">
  <!-- Show the page only once the title is drawn (the marker "page-ready" comes after the scripts) -->
  <link rel="expect" href="#page-ready" blocking="render">
</head>
<body class="lab-page">
  <!-- Project page "Israeli Movie Archive", built from Figma frame "Israeli Movie Archive" and its Frame 93.
       It works like The Israeli Cactus page: lab.js adds the black shapes that spell
       "ISRAELI MOVIE ARCHIVE" (top, and white at the bottom); archive-title.js says where they go. -->
  <main class="lab lab-invert archive" id="lab">
    <h1 class="visually-hidden">Israeli Movie Archive</h1>

    <!-- The first screen (the title) stays in place until the end of the page. First the black end comes up
         behind it (the title turns white), then the video slides up over it, and at the end the texts come up
         on the black (the order is set in styles.css, .archive). lab.js puts the title shapes in it. -->
    <div class="lab-first-track">
      <div class="lab-first" id="lab-first">
        <!-- Clicking the first screen scrolls down to the video -->
        <button class="lab-first-screen" id="lab-first-screen" type="button" aria-label="Scroll down to the project"></button>

        <!-- The white title: lies exactly on the black one, but only shows over the black end,
             so the title turns white where the black end passes (lab.js puts the shapes in it) -->
        <div class="lab-white" id="lab-white">
          <div class="lab-footer-title" id="lab-footer-title"></div>
        </div>
      </div>
    </div>

    <!-- Fixed on the screen on every page, also while scrolling (Figma: Frame 193, Frame 188 and "contact Me"):
         the small name on the left and right edges, in the middle of the screen. Hovering a half
         types its link under it: "home" under ELANA (back to the home page gallery, no intro)
         and "about me" under GERTEL. "contact Me" sits at the bottom in the middle (no link yet). -->
    <a class="flow-edge flow-edge-left" href="index.html?gallery">
      <img class="flow-logo" src="images/logo-elana-small.svg" alt="Elana">
      <span class="flow-edge-text">home<span class="flow-edge-cursor">|</span></span>
    </a>
    <a class="flow-edge flow-edge-right" href="about.html">
      <img class="flow-logo" src="images/logo-gertel-small.svg" alt="Gertel">
      <span class="flow-edge-text">about me<span class="flow-edge-cursor">|</span></span>
    </a>
    <p class="flow-small-text flow-contact">contact Me</p>

    <!-- The video (Figma: "הגשה קצרה אינדקס 1"): it slides up from the bottom of the screen and stops in
         the middle of the screen. It plays by itself, silent and on a loop. Until the file
         images/archive-video.mp4 is there, its still (the poster) shows instead. -->
    <div class="lab-track archive-track">
      <video class="lab-media" src="images/archive-video.mp4" poster="images/archive-video.jpg"
             autoplay muted loop playsinline aria-label="Israeli Movie Archive: the index screen over beach footage"></video>
    </div>

    <!-- The story box: white text on the black, like the paragraphs on the other project pages.
         While the video stays in the middle of the screen, it comes up from the bottom, sticks there
         for a while (like the paragraphs on the other pages), and then scrolls up and out of the top.
         Only then does the video leave, and only then do the closing texts come in (timing: .archive in styles.css).
         THE TEXT WILL BE GIVEN LATER: replace the placeholder, then set --a-text-h in styles.css to its height. -->
    <div class="lab-text-track archive-text" style="--x: 17; --top: var(--a-text); --next: var(--a-text-next); --w: 260">
      <p class="lab-text">[The project text will come here.]</p>
    </div>

    <!-- The black end of the page: the project details (Figma still has the cactus text here) -->
    <footer class="lab-footer">
      <p class="lab-footer-text lab-year">2023</p>
      <p class="lab-footer-text lab-kind">Digital Art</p>
      <p class="lab-footer-text lab-about">An illustrated book centered on cactus forms and symbols in Israel, combining botanical artwork with Hebrew text.</p>
    </footer>
  </main>

  <!-- The title (its shapes and organic letters) first, then the code that draws it -->
  <script src="pieces.js?v=20261111a"></script>
  <script src="archive-title.js?v=20261111a"></script>
  <script src="lab.js?v=20261108m"></script>
  <div id="page-ready"></div>
</body>
</html>
